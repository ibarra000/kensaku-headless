version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its ref is the Rust toolchain version (pinned to rust-version), not an action release.
      - dependency-name: dtolnay/rust-toolchain

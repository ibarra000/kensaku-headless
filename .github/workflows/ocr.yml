name: OCR (real models)

# Real PP-OCR (model pack + ONNX Runtime) on every shipped OS; scoped to OCR changes.
on:
  pull_request:
    paths:
      - "crates/kensaku-core/src/ocr.rs"
      - "crates/kensaku-core/src/ocr_indra/**"
      - "crates/kensaku-core/vendor/paddleocr_rs_onnx/**"
      - "crates/kensaku-core/src/models.rs"
      - "crates/kensaku-core/src/indexer/extract/**"
      - "crates/kensaku-core/src/indexer/mod.rs"
      - "crates/kensaku-core/Cargo.toml"
      - "Cargo.lock"
      - "crates/kensaku-core/tests/fixtures/ocr-ui-text/**"
      - ".github/workflows/ocr.yml"
      - ".github/actions/onnxruntime/**"
      - "tools/fetch-onnxruntime.sh"
  push:
    # Post-merge: only real-model jobs catch platform-specific OCR failures.
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    name: PP-OCR (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cold build + model tests; fail on stalls instead of hanging.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
        with:
          key: ocr-${{ matrix.os }}
          cache-on-failure: true

      - id: ort
        uses: ./.github/actions/onnxruntime
        with:
          rid: ${{ matrix.rid }}
          dest: ${{ runner.temp }}/ort

      - name: Download the PP-OCR and Indra packs
        shell: bash
        run: |
          set -euo pipefail
          pack="$RUNNER_TEMP/ocr-pack"
          mkdir -p "$pack"
          fetch() { curl -fsSL --retry 3 -o "$2" "$1"; }
          fetch https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_det_onnx/resolve/main/inference.onnx "$pack/det.onnx"
          fetch https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_rec_onnx/resolve/main/inference.onnx "$pack/rec.onnx"
          fetch https://github.com/GreatV/oar-ocr/releases/download/v0.7.0/ppocrv6_tiny_dict.txt "$pack/dict.txt"
          # Same checksums as crates/kensaku-core/src/models.rs. Hash via stdin: Windows sha256sum prefixes "\" for backslash paths.
          sum() { if command -v sha256sum >/dev/null; then sha256sum < "$1"; else shasum -a 256 < "$1"; fi | cut -d' ' -f1; }
          check() { [ "$(sum "$1")" = "$2" ] || { echo "checksum mismatch: $1"; exit 1; }; }
          check "$pack/det.onnx" 193bab7a04fca699a6c82e6abb5b81bdb28177f0abd4062552b04908dafb19f8
          check "$pack/rec.onnx" 9ef676d6ed3c88256a2d92c640c44f25b0c40947e111b14b8be8f594091563e6
          check "$pack/dict.txt" c5cbe34ef40c29c4df07ed012bf96569cb69a2d2a01a07027e9f13cb832bd9cd

          # Indra pack, same v1.1.0 artifacts and hashes as models.rs.
          indra="$RUNNER_TEMP/indra-pack"
          mkdir -p "$indra"
          base=https://huggingface.co/datalab-to/indra-ocr/resolve/v1.1.0
          for name in det.onnx rec.onnx rec_cjk.onnx rec_rtl.onnx rec_world.onnx script.onnx orient.onnx meta.json; do
            fetch "$base/$name" "$indra/$name"
          done
          check "$indra/det.onnx" f2bd4cba23e9c328cf7ec824634e423e191a2c6aacbbf35c62bd79dd70f62f59
          check "$indra/rec.onnx" 475972a2710be4a3cbfeb2bc7f3624ffd563de07de42476fc7a290d4e1ece484
          check "$indra/rec_cjk.onnx" 4a035516a17e62cdf33a4fe2d88077654cb8841cff024685cdef4e351694ef50
          check "$indra/rec_rtl.onnx" 468796bd684486a8388c30c8b4ed2a26e3eeb1f8ff02831c24c2e12c79a2a834
          check "$indra/rec_world.onnx" c8d1e59f21b04966f179d2d2d8e22b230d22110b3f89855bbbf2624a58c40043
          check "$indra/script.onnx" b6ce4e926e19c243faaf37bd46880398bf2cb4ae56a29e1177a3b017c1280e36
          check "$indra/orient.onnx" 20eaf670f55a7cf9facfe1bdd6c7b8e40be75bbf4d48a3df43f66aa3bbd874fd
          check "$indra/meta.json" 4ce4c94b46f5d644033c02e718322014ff4081270f385038c571912b56696339

          echo "KENSAKU_OCR_PACK_DIR=$pack" >> "$GITHUB_ENV"
          echo "KENSAKU_INDRA_PACK_DIR=$indra" >> "$GITHUB_ENV"
          echo "ORT_DYLIB_PATH=${{ steps.ort.outputs.path }}" >> "$GITHUB_ENV"

      # Single-threaded: the OCR engine choice is process-wide state.
      - name: Run the real-model PP-OCR tests
        shell: bash
        run: >
          cargo test -p kensaku-core --release --lib
          ocr::tests::real -- --include-ignored --test-threads=1 --nocapture
          --skip real_pack_reads_text

      # Both engines in one process exercises the shared ONNX Runtime session interaction.
      - name: Run the real-model Indra tests
        shell: bash
        run: >
          cargo test -p kensaku-core --release --lib
          ocr_indra::tests:: -- --include-ignored --test-threads=1 --nocapture

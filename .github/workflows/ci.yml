name: CI

# Only run for changes that can actually land: PRs and pushes to master.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A compile plus tests takes about 10 minutes. Without a bound, a stalled
    # download or build hangs until the workflow timeout.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Headless end-to-end smoke test
        shell: bash
        run: |
          cargo build -p kensaku --locked
          tools/headless-smoke.sh target/debug/kensaku

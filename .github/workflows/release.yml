name: Release builds

# Builds and packs `kensaku` per target, then drafts a GitHub release with SHA256SUMS.
# Windows signing (SignPath) runs only once its repo variables/secret are set; until then releases are unsigned.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ORT_VERSION: "1.31.0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ort_archive: onnxruntime-linux-x64
            ort_ext: tgz
            ort_sha256: cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57
            ort_lib: libonnxruntime.so.1.31.0
            ort_dest: libonnxruntime.so
          - platform: macos-latest
            target: aarch64-apple-darwin
            ort_archive: onnxruntime-osx-arm64
            ort_ext: tgz
            ort_sha256: 1031b36dd3bdaa8d976a6130d9cf2a05e9be320b93ae804f8427b91dc3432afc
            ort_lib: libonnxruntime.1.31.0.dylib
            ort_dest: libonnxruntime.dylib
          # Intel Macs: no bundled ONNX Runtime; OCR falls back to Tesseract.
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ort_archive: onnxruntime-win-x64
            ort_ext: zip
            ort_sha256: 3958d8a44984160692c1b4ffd0de3cb48f8c39f9d34bb31e433db06e30b82195
            ort_lib: onnxruntime.dll
            ort_dest: onnxruntime.dll
          # ONNX Runtime DLL must match the process architecture.
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            ort_archive: onnxruntime-win-arm64
            ort_ext: zip
            ort_sha256: ef6206fa8d6975878d93a97035d280240ce5764c126a7430e5427e18923316d5
            ort_lib: onnxruntime.dll
            ort_dest: onnxruntime.dll

    steps:
      - uses: actions/checkout@v7

      # Signing is opt-in: enabled only when all SignPath settings exist (docs/SIGNING.md).
      - name: Check Windows signing configuration
        id: signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $missing = @()
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += 'variable SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += 'variable SIGNPATH_PROJECT_SLUG' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += 'variable SIGNPATH_SIGNING_POLICY_SLUG' }
          if (-not $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) { $missing += 'variable SIGNPATH_ARTIFACT_CONFIGURATION_SLUG' }
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += 'secret SIGNPATH_API_TOKEN' }
          if ($missing.Count -gt 0) {
            Write-Host "::warning::Windows binary will be unsigned; missing: $($missing -join ', ')"
            "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - uses: dtolnay/rust-toolchain@1.120
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p kensaku --target ${{ matrix.target }}

      - name: Stage binary and ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          name="kensaku-${version}-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage"
          exe=kensaku; [ "$RUNNER_OS" = Windows ] && exe=kensaku.exe
          cp "target/${{ matrix.target }}/release/$exe" "$stage/$exe"
          cp LICENSE README.md "$stage/"
          if [ -n "${{ matrix.ort_archive }}" ]; then
            base="${{ matrix.ort_archive }}-${ORT_VERSION}"
            archive="$RUNNER_TEMP/$base.${{ matrix.ort_ext }}"
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/$base.${{ matrix.ort_ext }}"
            if command -v sha256sum >/dev/null; then sum=$(sha256sum < "$archive"); else sum=$(shasum -a 256 < "$archive"); fi
            [ "${sum%% *}" = "${{ matrix.ort_sha256 }}" ] || { echo "ONNX Runtime checksum mismatch"; exit 1; }
            case "${{ matrix.ort_ext }}" in
              zip) unzip -q "$archive" -d "$RUNNER_TEMP" ;;
              *) tar xzf "$archive" -C "$RUNNER_TEMP" ;;
            esac
            cp "$RUNNER_TEMP/$base/lib/${{ matrix.ort_lib }}" "$stage/${{ matrix.ort_dest }}"
          fi
          echo "STAGE=$stage" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload unsigned binary for signing
        if: steps.signing.outputs.enabled == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: sign-${{ matrix.target }}
          path: ${{ env.STAGE }}/kensaku.exe
          retention-days: 1

      - name: Sign binary
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/signed

      - name: Restore signed binary
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $signed = Get-ChildItem -Recurse -File signing\signed -Filter kensaku.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return a signed kensaku.exe" }
          $sig = Get-AuthenticodeSignature $signed.FullName
          # `test-signing` is self-signed; a release must chain to a public CA, so demand Valid.
          $okStatuses = if ($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'release-signing') {
            @('Valid')
          } else {
            @('Valid', 'UnknownError')
          }
          if ($sig.Status -notin $okStatuses) {
            throw "kensaku.exe came back without a valid signature ($($sig.Status))"
          }
          Write-Host "kensaku.exe: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          Copy-Item $signed.FullName "$env:STAGE\kensaku.exe" -Force

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$ARCHIVE_NAME.zip" "$ARCHIVE_NAME" >/dev/null
          else
            tar czf "$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          fi

      - name: Smoke test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          exe=kensaku; [ "$RUNNER_OS" = Windows ] && exe=kensaku.exe
          "$STAGE/$exe" --version
          "$STAGE/$exe" methods >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: kensaku-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # Assemble one draft release for maintainer review.
  publish:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Checkout before artifact download: `clean: true` would delete them.
      - uses: actions/checkout@v7

      # Only final archives; `sign-*` intermediates hold unsigned files.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: kensaku-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          test -n "$(find release -type f -print -quit)" || { echo "no release assets"; exit 1; }
          cd release
          find . -type f ! -name SHA256SUMS -exec sha256sum {} + | sort -k2 > SHA256SUMS

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Kensaku $TAG" --generate-notes
          find release -type f -print0 | xargs -0 gh release upload "$TAG" --clobber

name: Feature request
description: Suggest something that would make Kensaku better
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the existing issues and [docs/ARCHITECTURE.md](https://github.com/ibarra000/kensaku-headless/blob/main/docs/ARCHITECTURE.md)
        first — many ideas are already planned or deliberately deferred.

        Kensaku Headless is a local search engine with a CLI, daemon, HTTP and Rust
        API, and a read-only backend for agents. It has no GUI and does not include
        an LLM, cloud sync, or telemetry. Desktop-app requests belong in the
        original project: https://github.com/yjid/kensaku

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Be concrete: command, API method, parameters, output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other tools, or a smaller version of the idea.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search / ranking
        - Query language
        - Indexing / watcher
        - Documents / OCR
        - Images
        - CLI
        - Daemon / HTTP / Rust API
        - Config / diagnostics
        - Agents / MCP
        - Packaging / install
        - Other
    validations:
      required: true

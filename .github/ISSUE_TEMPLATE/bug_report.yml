name: Bug report
description: Something is wrong, slow, or missing results
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include the output of `kensaku doctor --json`
        and `kensaku stats --json` (plus `kensaku --version`) if you can — they
        answer most environment questions up front. Relevant lines from the
        daemon log (`kensaku daemon log` prints its path) help too.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour and what you expected instead.
      placeholder: "Searching for `type:pdf invoice` returns nothing, but the PDF is in ~/Documents."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `kensaku setup --root ~/Documents --wait`
        2. `kensaku search "type:pdf invoice"`
        4. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kensaku version
      description: Output of `kensaku --version`.
      placeholder: "kensaku 2.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows
    validations:
      required: true

  - type: input
    id: corpus
    attributes:
      label: Approximate corpus size
      placeholder: "~120k files across 2 roots"
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Doctor / diagnostics
      description: Paste the output of `kensaku doctor --json` and `kensaku stats --json`.
      render: json
    validations:
      required: false

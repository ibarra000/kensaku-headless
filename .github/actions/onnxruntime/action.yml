name: ONNX Runtime
description: Fetch the ONNX Runtime library from NuGet via tools/fetch-onnxruntime.sh (cached).

inputs:
  rid:
    description: NuGet runtime id (linux-x64, osx-arm64, win-x64, win-arm64).
    required: true
  dest:
    description: Directory to copy the library into.
    required: true

outputs:
  path:
    description: Full path of the extracted library.
    value: ${{ steps.extract.outputs.path }}

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ort-nuget
        key: onnxruntime-nuget-${{ hashFiles('tools/fetch-onnxruntime.sh') }}

    - id: extract
      shell: bash
      env:
        RID: ${{ inputs.rid }}
        DEST: ${{ inputs.dest }}
      run: |
        path=$(bash tools/fetch-onnxruntime.sh "$RID" "$DEST" "$RUNNER_TEMP/ort-nuget" | tail -1)
        echo "path=$path" >> "$GITHUB_OUTPUT"

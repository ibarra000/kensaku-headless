[workspace]
resolver = "3"
members = ["crates/kensaku-core", "crates/kensaku"]
default-members = ["crates/kensaku-core", "crates/kensaku"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "MIT"
rust-version = "1.98"

# Vendored paddleocr_rs_onnx 0.2.8 (MIT): shared ONNX env with Indra, single-thread sessions, bounded pool.
[patch.crates-io]
paddleocr_rs_onnx = { path = "crates/kensaku-core/vendor/paddleocr_rs_onnx" }

[profile.release]
# Thin LTO + parallel codegen: much faster builds, near-identical runtime.
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true

# Optimize heavy deps in dev builds; dropping their debug info saves GBs in target/debug.
[profile.dev.package."*"]
opt-level = 2
debug = false

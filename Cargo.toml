[workspace]
resolver = "3"
members = ["crates/kensaku-core", "crates/kensaku"]
# Excludes the vendored paddleocr_rs_onnx (a member only as a path dependency); CI runs these.
default-members = ["crates/kensaku-core", "crates/kensaku"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[profile.release]
# Thin LTO + parallel codegen: much faster builds, near-identical runtime.
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true

# Optimize heavy deps in dev builds; dropping their debug info saves GBs in target/debug.
[profile.dev.package."*"]
opt-level = 2
debug = false

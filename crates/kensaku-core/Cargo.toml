[package]
name = "kensaku-core"
version.workspace = true
description = "Headless local file and content search engine"
authors = ["yjid", "Kensaku Headless contributors"]
repository = "https://github.com/ibarra000/kensaku-headless"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kensaku_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"
nucleo-matcher = "0.3"
jwalk = "0.9"
notify = "8"
fs4 = "1.1"
dirs = "7"
log = "0.4"
parking_lot = "0.13"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
sha2 = "0.11"
rayon = "1.10"
lopdf = "0.47.0"
quick-xml = "0.42.0"
zip = "9.1.0"
ureq = { version = "2", features = ["tls", "json", "native-certs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
paddleocr_rs_onnx = { version = "0.2.8", default-features = false, optional = true }
# `load-dynamic`: the prebuilt static onnxruntime archive is compiled
# against glibc 2.38+ and cannot link on older toolchains (this broke CI's
# ubuntu-22.04 job when PP-OCRv6 joined the default builds). Dynamic loading
# needs `libonnxruntime` at runtime; when it is absent the accurate OCR path
# returns None and extraction falls back to Tesseract, which is always
# available.
ort = { version = "2.0.0-rc.15", optional = true, features = ["load-dynamic"] }
interprocess = "2.4.7"
# Daemon token generation (OS CSPRNG). Already in the tree via tantivy/ring.
getrandom = "0.3"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
parquet = { version = "60.1.0", default-features = false, features = ["snap", "flate2-rust_backend", "zstd", "lz4"] }
# Parses .eml (RFC 822 / MIME) for email content indexing.
mail-parser = "1.0.1"
# Parses Outlook .msg (OLE/MAPI) for email content indexing.
msg_parser = "0.3.6"
# Undoes msg_parser's hex rendering of binary MAPI properties (the HTML body).
# Already in the tree via msg_parser; no new download.
hex = "0.4"

[dev-dependencies]
# Builds Flate-compressed image streams for the scanned-PDF decoder tests.
# Already in the tree via zip/png; no new download.
flate2 = "1"
# Builds minimal Outlook .msg (OLE compound) files for the email extractor
# tests. Already in the tree via infer; no new download.
cfb = "0.16"

[target.'cfg(windows)'.dependencies]
# Process memory and priority (util/, ops/stats).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[features]
# Compile the accurate PP-OCRv6 path into normal builds. The model pack is
# downloaded only when OCR is enabled.
default = ["accurate-ocr"]
accurate-ocr = ["dep:paddleocr_rs_onnx", "dep:ort"]
smart-embeddings = ["dep:ort"]

[package]
name = "kensaku-core"
version.workspace = true
description = "Headless local file and content search engine"
authors = ["yjid", "Kensaku Headless contributors"]
repository = "https://github.com/ibarra000/kensaku-headless"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kensaku_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"
nucleo-matcher = "0.3"
jwalk = "0.9"
notify = "8"
fs4 = "1.1"
dirs = "7"
log = "0.4"
parking_lot = "0.13"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
sha2 = "0.11"
rayon = "1.10"
lopdf = "0.47.0"
quick-xml = "0.42.0"
zip = "9.1.0"
ureq = { version = "2", features = ["tls", "json", "native-certs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# Vendored 0.2.8 (MIT), modified: shared ONNX env with Indra, single-thread sessions, bounded pool.
# A path dependency (not [patch]) so git dependents build the same code.
paddleocr_rs_onnx = { path = "vendor/paddleocr_rs_onnx", version = "0.2.8", default-features = false, optional = true }
# `load-dynamic`: the static onnxruntime needs glibc 2.38+; without the lib at runtime OCR falls back to Tesseract.
ort = { version = "2.0.0-rc.15", optional = true, features = ["load-dynamic"] }
interprocess = "2.4.7"
# Daemon token generation (OS CSPRNG).
getrandom = "0.3"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
parquet = { version = "60.1.0", default-features = false, features = ["snap", "flate2-rust_backend", "zstd", "lz4"] }
# .eml (RFC 822 / MIME) parsing.
mail-parser = "1.0.1"
# Outlook .msg (OLE/MAPI) parsing.
msg_parser = "0.3.6"
# Undoes msg_parser's hex rendering of binary MAPI properties (HTML body).
hex = "0.4"

[dev-dependencies]
# Flate image streams for scanned-PDF decoder tests.
flate2 = "1"
# Minimal Outlook .msg files for email extractor tests.
cfb = "0.16"

[target.'cfg(windows)'.dependencies]
# Process memory and priority (util/, ops/stats).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[features]
# Accurate PP-OCRv6 in normal builds; the model pack downloads only when OCR is enabled.
default = ["accurate-ocr"]
accurate-ocr = ["dep:paddleocr_rs_onnx", "dep:ort"]
smart-embeddings = ["dep:ort"]

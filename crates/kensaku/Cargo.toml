[package]
name = "kensaku"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless Kensaku: CLI, index daemon, MCP and HTTP servers"
publish = false
authors = ["yjid", "Kensaku Headless contributors"]
repository = "https://github.com/ibarra000/kensaku-headless"

[[bin]]
name = "kensaku"
path = "src/main.rs"

[dependencies]
kensaku-core = { path = "../kensaku-core" }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
